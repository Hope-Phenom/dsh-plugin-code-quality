name: publish

# Publishes the plugin to npm with a provenance attestation, without storing any
# token: npm verifies the run through GitHub's OIDC identity instead.
#
# Before the first run, configure the trusted publisher on npmjs.com:
#   the package page → Settings → Trusted Publisher → GitHub Actions
#   Organization or user : Hope-Phenom
#   Repository           : dsh-plugin-code-quality
#   Workflow filename    : publish.yml
#   Environment          : (leave empty; if you set one, declare the same
#                          `environment:` on the job below or the OIDC claim
#                          will not match)
#
# Trusted publishing needs npm >= 11.5.1, which is newer than the npm bundled
# with Node 22, hence the upgrade step. Keep the trigger manual so a push can
# never publish by accident.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Package and validate only; do not publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately no `registry-url`: setup-node would write an empty
      # `_authToken` into .npmrc, and npm then reports the OIDC exchange as an
      # expired token instead of using it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Unit tests
        run: npm test

      - name: Conformance report
        run: npm run verify

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance
